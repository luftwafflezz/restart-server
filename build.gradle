plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.supported_minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Fabric Permissions API
    include(implementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))
}

processResources {
    // Captured at configuration time, as accessing the task's project at execution time is deprecated
    def modVersion = project.version

    inputs.property "version", modVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // Loom will automatically attach sourcesJar to the "build" task if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    // Captured at configuration time, as accessing the task's project at execution time is deprecated
    def archivesName = project.base.archivesName

    inputs.property "archivesName", archivesName

    from("LICENSE") {
        rename { "${it}_${archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// The Game Test mod lives in the default 'test' source set (src/test) and there are no JUnit tests.
// Gradle 9 fails the 'test' task (and therefore 'check' and 'build') when test sources exist but no tests are discovered.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

loom {
    runs {
        // ./gradlew runGameTest starts a headless Game Test server and writes the JUnit report to build/junit.xml
        // Fabric API's gametest module skips the dedicated server's eula.txt check when -Dfabric-api.gametest is set
        gameTest {
            server()

            displayName.set("Game Test")
            sourceSet.set("test")

            // Enable the gameTest runner
            systemProperties.put("fabric-api.gametest", "")
            systemProperties.put("fabric-api.gametest.report-file", project.layout.buildDirectory.file("junit.xml").map { it.asFile.absolutePath })
            runDirectory.set(project.layout.buildDirectory.dir("gametest"))
        }
    }
}
